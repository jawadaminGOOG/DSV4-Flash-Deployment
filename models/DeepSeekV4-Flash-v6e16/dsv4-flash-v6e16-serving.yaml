    +    """Builds every scatter index the compressor needs, for one cache group.
    +
    +  The result is a function of the batch layout and the page geometry only. It
    +  reads no cache, no weight, and no hidden state, so every layer that shares a
    +  KV-cache group and a page geometry derives the identical answer. Compute it
