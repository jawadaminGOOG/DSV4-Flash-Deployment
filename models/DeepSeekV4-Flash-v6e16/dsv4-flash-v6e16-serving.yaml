    +# The compressor's scatter indices are a function of the batch layout and the
    +# page geometry only, so every layer that shares a KV-cache group derives the
    +# identical answer. Each layer runs its own `shard_map`, and XLA does not share
    +# work across those regions, so the derivation runs once per layer. This cache
    +# makes it run once per group.
    +#
    +# The key is the KV-cache group index. It cannot be the identity of the input
    +# arrays: `jax.jit` gives every pytree leaf its own tracer and does not
    +# deduplicate a repeated leaf, so two layers in one group hold distinct tracers
    +# for the same runtime buffer and `a is b` is false for every layer after the
    +# first.
    +#
    +# The page geometry alone is not a safe key either. A model can hold more
    +# KV-cache groups than distinct geometries, and two groups that share a geometry
    +# must not share scatter indices.
    +_LAYER_TO_KV_GROUP: dict[str, int] = {}
    +
    +
    +def register_kv_cache_groups(kv_cache_groups) -> None:
    +    """Records which KV-cache group owns each layer.
    +
    +    The runner calls this once, after it builds the groups. A compressor layer
    +    cannot derive this for itself. The groups do not exist when the layer is
    +    constructed, because vLLM builds them afterwards from the layers' own
    +    specs.
    +
    +    The map holds only strings and integers, never a JAX array, so it is safe
    +    at module scope and it never keeps a tracer alive.
    +    """
    +    _LAYER_TO_KV_GROUP.clear()
    +    for group_id, group in enumerate(kv_cache_groups):
    +        for layer_name in group.layer_names:
    +            _LAYER_TO_KV_GROUP[layer_name] = group_id
    +
    +
    +# The memo holds tracers, so an entry is valid only inside the trace that built
    +# it. The wrapper context is a fresh object for every trace, so a change of
    +# object marks a new trace and the memo is dropped. Reuse across traces would
    +# raise an escaped-tracer error.
    +#
    +# The owner is held by weak reference, and the entries are dropped as soon as
    +# the owner dies. A strong reference would outlive the trace and keep that
    +# trace's whole context alive, including its `kv_caches`, `expert_indices_list`
    +# and `shared_attn_metadata`, because the context manager that created it drops
    +# its own reference on exit. The memo would then be the only thing holding a
    +# finished trace, for as long as the process ran.
    +#
    +# A weak reference is also what makes the identity test sound. A dead reference
    +# reads as `None`, which never matches a live context, so a new object at a
    +# recycled address cannot be mistaken for the old one.
    +_MEMO_OWNER = None
    +_MEMO_TOKEN = 0
    +_MEMO: dict = {}
    +
    +
    +def _drop_memo(token: int) -> None:
    +    """Empties the memo when the trace that filled it ends.
    +
    +    `token` names the owner that installed this callback. A callback from an
    +    older owner does nothing, so a late finaliser cannot empty a newer trace's
    +    entries.
    +    """
    +    if token == _MEMO_TOKEN:
    +        _MEMO.clear()
    +
    +
    +def _cached_metadata(wrapper_ctx, key, build):
    +    """Returns the memoised metadata for `key`, or builds it and stores it.
    +
    +    A miss recomputes, which is what the code did before this cache existed.
    +    So a miss costs speed and never correctness. A `None` key disables the memo
    +    and always builds, which is the path for a layer the runner never
    +    registered.
    +    """
    +    global _MEMO_OWNER, _MEMO_TOKEN
    +    if wrapper_ctx is None or key is None:
    +        return build()
    +    owner = _MEMO_OWNER() if _MEMO_OWNER is not None else None
    +    if owner is not wrapper_ctx:
    +        _MEMO.clear()
    +        _MEMO_TOKEN += 1
    +        _MEMO_OWNER = weakref.ref(wrapper_ctx)
    +        weakref.finalize(wrapper_ctx, _drop_memo, _MEMO_TOKEN)
    +    if key not in _MEMO:
    +        _MEMO[key] = build()
    +    return _MEMO[key]
    +
     
